name: Build Kernel for Raphael

on:
  workflow_dispatch:
  push:
    branches:
      - "#raphael"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: LawRun
      KBUILD_BUILD_HOST: GitHub
      OUT_DIR: out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev \
            libncurses5-dev curl zip unzip ccache python3

      - name: Download Clang toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz
          echo "CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_ENV

      - name: Download GCC cross-compiler
        run: |
          mkdir -p $GITHUB_WORKSPACE/gcc
          cd $GITHUB_WORKSPACE/gcc
          git clone --depth=1 https://github.com/baalajimaestro/aarch64-linux-android-4.9 aarch64
          git clone --depth=1 https://github.com/baalajimaestro/arm-linux-androideabi-4.9 arm

      - name: Build kernel
        run: |
          export PATH=$CLANG_PATH:$PATH
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/aarch64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc/arm/bin/arm-linux-androideabi-
          export CC=clang

          make O=$OUT_DIR raphael_defconfig
          make -j$(nproc) O=$OUT_DIR

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp $OUT_DIR/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 $GITHUB_WORKSPACE/raphael-kernel.zip *

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v3
        with:
          name: raphael-kernel
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            raphael-kernel.zip
