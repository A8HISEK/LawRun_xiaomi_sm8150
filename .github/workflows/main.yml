name: Build Kernel (Raphael)

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: LawRun
      KBUILD_BUILD_HOST: GitHub
      OUT_DIR: out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev \
            libncurses5-dev curl zip unzip ccache python3

      - name: Download Proton Clang toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O proton-clang.tar.gz
          tar -xf proton-clang.tar.gz
          mv proton-clang-master proton-clang
          echo "CLANG_PATH=$GITHUB_WORKSPACE/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Download GCC cross-compiler tarballs
        run: |
          mkdir -p $GITHUB_WORKSPACE/gcc
          cd $GITHUB_WORKSPACE/gcc
          wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz -O aarch64-gcc.tar.gz
          tar -xf aarch64-gcc.tar.gz
          wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/master.tar.gz -O arm-gcc.tar.gz
          tar -xf arm-gcc.tar.gz

      - name: Build kernel
        run: |
          export PATH=$CLANG_PATH:$PATH
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++

          make O=$OUT_DIR raphael_defconfig
          make -j$(nproc) O=$OUT_DIR

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp $OUT_DIR/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 $GITHUB_WORKSPACE/raphael-kernel.zip *

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raphael-kernel
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            raphael-kernel.zip
